<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Running For Hope</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #000;
			color: #ccc;
			font-family: system-ui, sans-serif;
			overflow: hidden;
		}
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
		}
		#frame {
			position: relative;
		}
		#game {
			position: absolute;
			top: 0;
			left: 0;
			width: 800px;
			height: 600px;
			transform-origin: 0 0;
		}
		#game ruffle-player {
			width: 800px;
			height: 600px;
		}
		footer {
			font-size: 13px;
		}
		footer a {
			color: #8ab4f8;
		}
	</style>
	<script src="ruffle/ruffle.js"></script>
</head>
<body>
	<div id="frame"><div id="game"></div></div>
	<footer>
		Click the game to give it keyboard focus. Runs via <a href="https://ruffle.rs">Ruffle</a> ·
		<a href="https://github.com/arjanfrans/running-for-hope">Source</a>
	</footer>
	<script>
		const GAME_WIDTH = 800;
		const GAME_HEIGHT = 600;
		const FOOTER_SPACE = 48;

		const frame = document.getElementById("frame");
		const game = document.getElementById("game");

		function fitToWindow() {
			const scale = Math.min(
				window.innerWidth / GAME_WIDTH,
				(window.innerHeight - FOOTER_SPACE) / GAME_HEIGHT
			);
			frame.style.width = GAME_WIDTH * scale + "px";
			frame.style.height = GAME_HEIGHT * scale + "px";
			game.style.transform = "scale(" + scale + ")";
		}

		window.addEventListener("resize", fitToWindow);
		fitToWindow();

		window.RufflePlayer = window.RufflePlayer || {};
		window.RufflePlayer.config = {
			autoplay: "on",
			letterbox: "off",
			splashScreen: true,
			allowFullscreen: false,
			preferredRenderer: "webgpu",
			backgroundColor: "#000000",
			fontSources: [
				"fonts/LiberationSans-Regular.ttf",
				"fonts/LiberationSans-Bold.ttf",
			],
			defaultFonts: {
				sans: ["Liberation Sans"],
			},
		};

		window.addEventListener("load", () => {
			const player = window.RufflePlayer.newest().createPlayer();
			game.appendChild(player);
			player.ruffle().load({ url: "RunningForHope.swf", base: "./" });
		});
	</script>
</body>
</html>
