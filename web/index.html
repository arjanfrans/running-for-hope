<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Running For Hope</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #000;
			color: #ccc;
			font-family: system-ui, sans-serif;
		}
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
		}
		#game {
			width: min(100vw, calc((100vh - 48px) * 4 / 3));
			aspect-ratio: 4 / 3;
		}
		#game ruffle-player {
			width: 100%;
			height: 100%;
		}
		footer {
			font-size: 13px;
		}
		footer a {
			color: #8ab4f8;
		}
	</style>
	<script src="ruffle/ruffle.js"></script>
</head>
<body>
	<div id="game"></div>
	<footer>
		Click the game to give it keyboard focus. Runs via <a href="https://ruffle.rs">Ruffle</a> ·
		<a href="https://github.com/arjanfrans/running-for-hope">Source</a>
	</footer>
	<script>
		window.RufflePlayer = window.RufflePlayer || {};
		window.RufflePlayer.config = {
			autoplay: "on",
			letterbox: "on",
			splashScreen: true,
			allowFullscreen: true,
			preferredRenderer: "webgpu",
			backgroundColor: "#000000",
		};

		window.addEventListener("load", () => {
			const player = window.RufflePlayer.newest().createPlayer();
			document.getElementById("game").appendChild(player);
			player.ruffle().load({ url: "RunningForHope.swf", base: "./" });
		});
	</script>
</body>
</html>
